    <script>
      // Восстанавливаем путь из ?p= после редиректа 404.html
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Обрабатываем ?p= параметр от 404.html
        var search = window.location.search;
        if (search.indexOf('?p=/') === 0 || search.indexOf('&p=/') !== -1) {
          var params = search.slice(1).split('&');
          var path = '';
          var query = [];
          for (var i = 0; i < params.length; i++) {
            if (params[i].indexOf('p=/') === 0) {
              path = '/' + params[i].slice(3).replace(/~and~/g, '&');
            } else if (params[i].indexOf('q=') === 0) {
              query.push(params[i].slice(2).replace(/~and~/g, '&'));
            }
          }
          if (path) {
            window.history.replaceState(null, null,
              window.location.pathname.split('/').slice(0, 2).join('/') + path +
              (query.length ? '?' + query.join('&') : '') +
              window.location.hash
            );
          }
        }
      })();
    </script>
